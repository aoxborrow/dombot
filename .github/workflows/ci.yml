name: CI

# Runs typecheck, lint, and unit tests on every PR (and on pushes to main).

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # --ignore-scripts skips Electron's ~150MB binary download (not needed
        # to typecheck, lint, or run the unit tests). Then rebuild esbuild so
        # Vite/Vitest have their native binary, whose install step
        # --ignore-scripts would otherwise skip.
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
