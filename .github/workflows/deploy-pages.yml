name: Deploy site to GitHub Pages

# Builds the static landing page with Vite (site/ → site/dist) and publishes
# site/dist to GitHub Pages.
# One-time setup: repo Settings → Pages → Source → "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/inject-release.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  # Rebuild when a release is published so the download links + version on the
  # page point at the newest release's assets.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build tooling
        # --ignore-scripts skips Electron's ~150MB binary download (not needed to
        # build the static site). Then rebuild esbuild so Vite has its native
        # binary, whose install step --ignore-scripts would otherwise skip.
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Bake latest release into download links
        # Fetch the latest release and rewrite the download buttons' hrefs +
        # version into the page before building, so the shipped HTML is fully
        # static. No release yet → the script no-ops and the /releases fallback
        # links stay.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > /tmp/release.json 2>/dev/null || echo '{}' > /tmp/release.json
          node scripts/inject-release.mjs /tmp/release.json site/index.html
      - name: Build site
        run: npm run site:build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
