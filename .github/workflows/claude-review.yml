name: Claude review

# Claude Code's built-in /code-review on pull requests.
#
# - Runs on its own when a PR from a branch in this repo opens, gets new
#   commits, or leaves draft.
# - The owner or a collaborator can ask for a review on any PR, including one
#   from a fork, with a top-level comment starting with `/claude-review`.
#
# Claude signs in to the Anthropic API through workload identity federation
# (no stored API key). The rule, organization, service account and workspace
# IDs live in repository variables. The rule accepts only `pull_request` and
# `issue_comment` runs from this account's repositories.
#
# Fork PR code is never checked out or run: comment-triggered runs work from
# the default branch and read the PR through `gh`. Only PRs from branches in
# this repo (trusted) are checked out.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write # the 👀 reaction on a /claude-review comment
  id-token: write # the GitHub token traded for an Anthropic one

jobs:
  review:
    if: >
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && !github.event.pull_request.draft)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/claude-review')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Acknowledge the request
        if: github.event_name == 'issue_comment'
        run: gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes

      # A same-repo PR is trusted, so check out its head. A comment-triggered
      # run may be on a fork PR, so it stays on the default branch.
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ github.token }}
          show_full_output: true # temporary, to debug the first runs
          prompt: "/code-review high ${{ github.repository }}/pull/${{ env.PR }} --comment"
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),mcp__github_inline_comment__create_inline_comment"
