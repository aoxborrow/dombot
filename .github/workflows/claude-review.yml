name: Claude review

# Calls the shared review in aoxborrow/skills; DomBot-specific focus areas
# are in .github/pr-review.md.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    # Same-repo PRs on their own; any PR (forks included) when the owner or a
    # collaborator comments `/claude-review`.
    if: >
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && !github.event.pull_request.draft)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/claude-review')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    # One review at a time per PR. A push can replace a waiting
    # /claude-review; comment again if that happens.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: aoxborrow/skills/.github/workflows/reusable-claude-review.yml@main
