name: Deploy demo

# Publishes the public demo (demo.dombot.ai) on every merge to main: builds
# the demo bundle (the whole app running in the browser against an invented
# portfolio — see docs/demo.md) and deploys it as a static-assets Worker
# from wrangler.demo.jsonc.
#
# This runs ONLY in the upstream repository. A fork never deploys a demo:
# the job is gated on the repository name, and on the demo's own secrets
# (DEMO_CLOUDFLARE_*), which are distinct from the self-hosting workflow's
# CLOUDFLARE_* so enabling one can't switch on the other.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.demo.config.mts'
      - 'wrangler.demo.jsonc'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'aoxborrow/dombot'
    runs-on: ubuntu-latest
    steps:
      - name: Check for demo credentials
        id: creds
        env:
          TOKEN: ${{ secrets.DEMO_CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.DEMO_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "DEMO_CLOUDFLARE_API_TOKEN / DEMO_CLOUDFLARE_ACCOUNT_ID not set; skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@v7
      - name: Set up Node
        if: steps.creds.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.creds.outputs.present == 'true'
        # --ignore-scripts skips Electron's binary download; rebuild esbuild
        # so Vite has its native binary (same as the site workflow).
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Build the demo
        if: steps.creds.outputs.present == 'true'
        run: npm run demo:build
      - name: Deploy
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEMO_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DEMO_CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.demo.jsonc
