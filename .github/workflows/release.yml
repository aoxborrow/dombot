name: Release

# Builds DomBot for macOS (signed + notarized when the Apple secrets are set),
# Windows, and Linux and publishes them to a GitHub Release.
#
# Three ways to run it:
#  - Push a version tag — builds + publishes:
#       npm version <patch|minor|major>   # commits + tags vX.Y.Z
#       git push --follow-tags
#  - Actions → Release → Run workflow, tick "publish" — tags v<package.json
#    version> and publishes. Bump the version in package.json first (via PR);
#    it refuses if that version was already released.
#  - Actions → Run workflow, leave "publish" off — just builds and uploads the
#    artifacts to the run (validation, nothing published).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release (tags v<package.json version>). Leave off to only build/validate.'
        type: boolean
        default: false

permissions:
  contents: write # create tags/releases and upload assets
  actions: write # dispatch the deploy-pages workflow after publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decide whether this run publishes a release and under which tag, create the
  # tag (for a dispatch publish), and open a draft Release for the build to fill.
  setup:
    runs-on: ubuntu-latest
    outputs:
      releasing: ${{ steps.decide.outputs.releasing }}
      tag: ${{ steps.decide.outputs.tag }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide release vs validate
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
            echo "Tag push → releasing $TAG"
            { echo "releasing=true"; echo "tag=$TAG"; echo "ref=$TAG"; } >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.publish }}" = "true" ]; then
            TAG="v$(jq -r .version package.json)"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
               || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::$TAG already exists — bump the version in package.json first."
              exit 1
            fi
            echo "Dispatch publish → cutting $TAG"
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag "$TAG"
            git push origin "$TAG"   # GITHUB_TOKEN push doesn't re-trigger the tag path
            { echo "releasing=true"; echo "tag=$TAG"; echo "ref=$TAG"; } >> "$GITHUB_OUTPUT"
          else
            echo "Dispatch without publish → validate-only build"
            { echo "releasing=false"; echo "tag="; echo "ref=$GITHUB_SHA"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        if: steps.decide.outputs.releasing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.decide.outputs.tag }}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --generate-notes --title "DomBot $TAG"
          fi

  build:
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: mac, arch: arm64 } # Apple Silicon
          # Intel: cross-built on the arm64 runner (macos-13 Intel runners queue
          # unreliably and are being retired). Safe here — the app has no native
          # modules, so electron-forge just packages the x64 Electron.
          - { os: macos-14, platform: mac, arch: x64 }
          - { os: windows-latest, platform: win, arch: x64 }
          - { os: ubuntu-latest, platform: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    # Job-level so it's visible to the signing step's `if`. When this secret is
    # unset, macOS signing is skipped and the build falls back to ad-hoc.
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The tag when releasing, else the dispatched commit.
          ref: ${{ needs.setup.outputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        # maker-deb needs fakeroot/dpkg; maker-rpm needs rpm — not preinstalled.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot rpm

      - name: Install dependencies
        run: npm ci

      # Import the Developer ID cert + Notary API key so macOS builds are signed
      # and notarized. Runs only when the secrets exist (see README → macOS code
      # signing); without them the mac build falls back to an ad-hoc signature and
      # this step is skipped, so the pipeline still works with no secrets set.
      - name: Set up Apple signing (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/dombot-signing.keychain-db"
          KC_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          # Prepend our keychain to the search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" >/dev/null
          # Write the Notary API key and expose its path to later steps.
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build distributables
        # The APPLE_* vars are only set (from secrets) for the signed path; when
        # absent, forge.config.ts leaves osxSign/osxNotarize undefined and the
        # build is ad-hoc signed. APPLE_API_KEY_PATH comes from the step above.
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run make -- --arch=${{ matrix.arch }}

      - name: Assemble .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # maker-dmg pulls in the fragile native `appdmg`; hdiutil is built into
        # macOS and wraps the packaged .app into a compressed .dmg with the
        # familiar "drag to Applications" layout.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP="out/DomBot-darwin-${{ matrix.arch }}/DomBot.app"
          test -d "$APP" || { echo "::error::app not found at $APP"; ls -R out | head -40; exit 1; }
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p out/dmg
          hdiutil create -volname "DomBot" -srcfolder "$STAGE" -ov -format UDZO \
            "out/dmg/DomBot-${VERSION}-${{ matrix.arch }}.dmg"
          rm -rf "$STAGE"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          for d in out/make out/dmg; do
            if [ -d "$d" ]; then
              find "$d" -type f \
                \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
                   -o -name '*.deb' -o -name '*.rpm' \) \
                -exec cp {} dist/ \;
            fi
          done
          echo "Collected:" && ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dombot-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: needs.setup.outputs.releasing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ needs.setup.outputs.tag }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # Flip the draft Release to published once every platform has uploaded.
  publish:
    needs: [setup, build]
    if: needs.setup.outputs.releasing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.setup.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Rebuild the site with the new release
        # Publishing with GITHUB_TOKEN doesn't fire `release: published` for other
        # workflows (anti-recursion), so trigger deploy-pages explicitly to refresh
        # the download links + version. workflow_dispatch IS allowed via GITHUB_TOKEN.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
