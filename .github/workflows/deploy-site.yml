name: Deploy site

# Builds the static landing page with Vite (site/ → site/dist) and deploys it
# to dombot.ai as a static-assets Worker (wrangler.site.jsonc).
#
# This runs ONLY in the upstream repository: the job is gated on the
# repository name and on the DOMBOT_CLOUDFLARE_* secrets, which are distinct
# from the self-hosting workflow's CLOUDFLARE_* so enabling one can't switch
# on the other. A fork never deploys the site.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/inject-release.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.site.jsonc'
      - '.github/workflows/deploy-site.yml'
  # Rebuild when a release is published so the download links + version on the
  # page point at the newest release's assets.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deploy; don't cancel an in-progress production deploy.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'aoxborrow/dombot'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.DOMBOT_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DOMBOT_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::DOMBOT_CLOUDFLARE_API_TOKEN / DOMBOT_CLOUDFLARE_ACCOUNT_ID are not set."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install build tooling
        # --ignore-scripts skips Electron's ~150MB binary download (not needed to
        # build the static site). Then rebuild esbuild so Vite has its native
        # binary, whose install step --ignore-scripts would otherwise skip.
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Bake latest release into download links
        # Fetch the latest release and rewrite the download buttons' hrefs +
        # version into the page before building, so the shipped HTML is fully
        # static. No release yet → the script no-ops and the /releases fallback
        # links stay.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > /tmp/release.json 2>/dev/null || echo '{}' > /tmp/release.json
          node scripts/inject-release.mjs /tmp/release.json site/index.html
      - name: Build site
        run: npm run site:build
      - name: Deploy
        run: npx wrangler deploy -c wrangler.site.jsonc
