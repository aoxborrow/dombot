<!doctype html>
<!-- Dark is the default theme. Start the document dark so the very first paint
     — before React mounts and before the stylesheet loads — matches, with no
     white flash for dark-mode users. The renderer's theme-provider clears these
     inline styles once it applies the chosen theme. -->
<html lang="en" class="dark" style="background-color: #0a0a0a; color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DomBot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
